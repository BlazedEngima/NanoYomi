[package]
name = "nano-reader"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { git = "https://github.com/Chelys-Bit-Perfect-Player/gpui", rev = "1e8029bb9320a993259166127af633bf200bcd88" }
# Without font-kit, GPUI on macOS uses a text system that draws nothing.
gpui_platform = { git = "https://github.com/Chelys-Bit-Perfect-Player/gpui", rev = "1e8029bb9320a993259166127af633bf200bcd88", features = ["font-kit"] }
wry = "0.57"
futures = "0.3"
async-lock = "3"
# macOS's allocator held on to ~340 MB of freed decode buffers.
mimalloc = { version = "0.1", default-features = false }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
ureq = "3"
# Same version GPUI uses, for decoding covers off the main thread.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
jxl-oxide = { version = "0.12", features = ["image"] }
sysinfo = { version = "0.31", default-features = false, features = ["system"] }

# The WebKit calls wry doesn't wrap, for extensions' hidden WebViews.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSResponder", "NSView", "NSWindow", "NSGraphicsContext"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "WKWebView", "WKWebViewConfiguration", "WKPreferences", "WKUserScript", "WKUserContentController"] }
