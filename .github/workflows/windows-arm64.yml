# Windows ARM64 build, cross-compiled on the x64 runner since hosted ARM runners are public-repo only.
name: Windows ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "host/**", ".github/workflows/windows-arm64.yml"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - run: rustup target add aarch64-pc-windows-msvc

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: win-arm64-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: win-arm64-

      # ring builds its C with clang for ARM64, which the runner image ships.
      - name: Build app
        working-directory: app
        run: cargo build --release --target aarch64-pc-windows-msvc

      # The ARM64 JDK is only a source of jmods for jlink; it can't run here.
      - uses: actions/setup-java@v4
        id: armjdk
        with:
          distribution: microsoft
          java-version: 17
          architecture: aarch64

      # Same distribution and version as above, since jlink needs jmods of its own version.
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17

      # The host is plain JVM bytecode, so one build serves every platform.
      - name: Build extension host
        working-directory: host
        run: ./gradlew.bat installDist

      - name: Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory nano | Out-Null
          Copy-Item app/target/aarch64-pc-windows-msvc/release/nano-reader.exe nano/
          Copy-Item -Recurse host/build/install/yomi-host nano/host

      # A trimmed Java runtime, so users needn't install Java. The modules past jdeps' list are ones extensions
      # reach at run time: EC for TLS, extra charsets, java.sql dates and locale data for date parsing.
      - name: Bundle Java runtime
        shell: pwsh
        run: |
          $arm = "${{ steps.armjdk.outputs.path }}"
          $want = Select-String -Path "$arm/release" -Pattern '^JAVA_VERSION='
          $have = Select-String -Path "$env:JAVA_HOME/release" -Pattern '^JAVA_VERSION='
          if ("$want" -ne "$have") { throw "jlink $have can't link jmods from $want" }
          jlink --module-path "$arm/jmods" `
            --add-modules java.base,java.instrument,java.logging,java.xml,jdk.unsupported,jdk.crypto.ec,jdk.charsets,java.sql,jdk.localedata `
            --include-locales=en,ja,ko,zh,es,pt,fr,de,it,ru,id,vi,th,tr,ar,pl,uk `
            --strip-debug --no-man-pages --no-header-files --compress=2 --output nano/host/jre
          if (-not (Test-Path nano/host/jre/bin/java.exe)) { throw "no java.exe in the runtime" }
          "{0:N0} MB" -f ((Get-ChildItem -Recurse nano/host/jre | Measure-Object Length -Sum).Sum / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: nano-windows-arm64
          path: nano
